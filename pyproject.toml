[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-object-detection"
version = "0.1.0"
description = "Détection d'objets en temps réel avec OpenCV et YOLO."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aliou BA" }]
keywords = ["computer-vision", "object-detection", "yolo", "opencv"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "ultralytics>=8.3,<9",
  "opencv-python>=4.9,<5",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/l8ne2/real-time-object-detection"
Issues = "https://github.com/l8ne2/real-time-object-detection/issues"

[project.scripts]
object-detect = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"