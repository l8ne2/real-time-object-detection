[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-object-detection"
version = "0.1.0"
description = "Détection d'objets en temps réel avec OpenCV et YOLO."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aliou BA" }]
keywords = ["computer-vision", "object-detection", "yolo", "opencv"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "ultralytics>=8.4,<9",
  "opencv-python>=4.14,<5",
  "numpy>=2.3,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # erreurs de style (pycodestyle)
  "F",   # erreurs logiques (pyflakes)
  "I",   # tri des imports
  "UP",  # syntaxe Python moderne
  "B",   # bugs courants
  "SIM", # simplifications
]
[project.urls]
Homepage = "https://github.com/l8ne2/real-time-object-detection"
Issues = "https://github.com/l8ne2/real-time-object-detection/issues"

[project.scripts]
object-detect = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  'if __name__ == "__main__":',
]